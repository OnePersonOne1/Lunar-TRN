# lunar-trn config.yaml — 숫자 파라미터의 단일 소스
# 초기값이다. scenario는 P1 실현가능성 테스트로, trn_band는 P3 결과로 사람이 확정한다.
# Claude는 이 파일의 scenario / trn_band / site 값을 스스로 바꾸지 않는다.

seed: 0

moon:
  g: [0.0, 0.0, -1.62]        # m/s^2, L(ENU)
  R_m: 1737400.0              # m

site:                          # 2026-08-27 사용자 확정: SLIM 착륙점(LROC 측정 13.3160S, 25.2510E) = L 원점
  lat0_deg: -13.3160
  lon0_deg: 25.2510
  box_km: [340.0, 60.0]       # L 프레임 [East 폭, North 폭]. 원점이 중심. 공칭 궤적(서→동 접근)+카메라 풋프린트가 전 구간 안에 들어와야 함 (2026-08-27 사용자 승인: 220→340 확장)

camera:
  W: 1024
  H: 1024
  fov_v_deg: 60.0
  rate_hz: 1.0

catalog:
  D_min_m: 1000.0
  p_min_px: 12

trn_band:                      # 2026-08-27 사용자 확정(box 340 재분석): p3_altitude_band 제안(16472~30000 m)의 안쪽 반올림
  h_min_m: 22000.0             # 2026-08-29 사용자 확정(19000→22000): 실런 4시드 중앙값 483→257 m, p5_sigma_vs_altitude·p5_hmin_tradeoff 근거. iid 통계는 17 km를 가리키나 시간상관 편향으로 실런과 모순(폐루프 평가 필요성의 실증)
  h_max_m: 30000.0
  n_min_in_view: 8

imu:
  rate_hz: 100.0
  sigma_a: 0.005               # m/s^2, 샘플당 가속도계 백색잡음 (bias 없음 → IMU-only 구간 드리프트 과소평가, TODO(oct))

scenario:                      # P1 테스트 "참값 상태 + ZEM/ZEV로 1 m 이내 착륙, |a_T| <= a_max" 통과해야 함
  r0: [-150000.0, 0.0, 30000.0]   # m, L
  v0: [900.0, 0.0, -40.0]         # m/s, L
  T_f: 350.0                      # s
  a_max: 6.0                      # m/s^2
  t_go_min: 1.0                   # s

ekf:
  P0_diag: [1.0e6, 1.0e6, 1.0e6, 1.0e2, 1.0e2, 1.0e2]   # m^2 x3, (m/s)^2 x3
  x0_error: [500.0, 500.0, 300.0, 5.0, 5.0, 3.0]        # 초기 추정 오차 1σ (시뮬에서 참값에 더함)
  gate_chi2: 11.345                                     # χ²_3(0.99)
  delay_compensation: true
  reject_streak_n: 5           # 연속 기각 이 횟수면 P 팽창(재획득). 0이면 비활성
  reject_inflate: 4.0          # P 팽창 배율 (게이트 판정식 §2.4는 불변)
  reject_inflate_max_n: 3      # 비행당 팽창 예산 — 저품질 구간에서 불량 측정 삼킴 방지

measurement:
  mode: calibrated             # assumed | calibrated (calibrated면 아래 file 사용). P7b(2026-08-31)부터 calibrated 기준
  file: results/measurement_model.json
  sigma_xyz_m: [50.0, 50.0, 30.0]   # assumed 값. P5 보정 전까지 그림에 "assumed" 표기
  fp_rate: 0.05                     # 오검출(잘못된 연관) 확률
  fp_offset_m: 2000.0               # 오검출 이상치 크기 — calibrated면 파일의 fp_offset_med_m이 우선
  fp_sweep: [0.0, 0.05, 0.10, 0.20, 0.30]  # 오검출률 스윕 (연구계획서 산출물 ④)
  n_min_inliers: 4
  assoc_gate_px: 50.0               # 데이터 연관 게이트 반경 (예측 투영 vs 탐지 중심)

tau:
  mode: constant               # constant | empirical
  constant_s: 0.5
  serial: false                # true면 직렬 처리: 직전 프레임 처리(τ) 중에는 촬영 생략(드롭)
  empirical_file: results/tau_ort_cpu_int8.json
  sweep_s: [0.05, 0.2, 0.5, 1.0, 2.0, 5.0]
  sweep_serial_s: [0.05, 1.0, 2.0, 5.0]   # 직렬 모드 τ 격자 (P7b)
  measured_points:             # 실측 τ 지점 (파일의 median_s 사용)
    - {file: results/tau_trt_int8.json, label: "n INT8 GPU"}
    - {file: results/tau_ort_cpu_int8.json, label: "n INT8 CPU"}
    - {file: results/tau_ort_cpu_fp32.json, label: "n FP32 CPU"}
    - {file: results/s/tau_ort_cpu_int8.json, label: "s INT8 CPU"}
    - {file: results/s/tau_ort_cpu_fp32.json, label: "s FP32 CPU"}

mc:
  n_runs: 200
  workers: 8
  bootstrap_n: 1000            # CEP 부트스트랩 95% CI 리샘플 횟수

detector:
  model: yolo11n.pt            # YOLO 계열 nano. 계열 내 최신 nano로 교체 가능
  imgsz: 1024
  conf: 0.25
  epochs: 100
  batch: 16

dataset:
  n_frames: 1000
  val_fraction: 0.2            # 궤적 구간 단위 분리(프레임 무작위 분리 금지)
  sun_el_deg: [10.0, 60.0]
  sun_az_deg: [0.0, 360.0]

bench:
  warmup: 50
  n_iter: 1000
  cpu_threads: 1
  calib_images: 100

unity:
  host: 127.0.0.1
  port: 5555
  terrain_heightmap_res: 4097  # 2^n + 1
  timeout_s: 10.0
